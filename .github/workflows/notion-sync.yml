name: Sync Notion Page to Git

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically checks for updates every 30 minutes
  workflow_dispatch:       # Allows you to trigger the sync manually with a button click

permissions:
  contents: write         # Grants GitHub permission to commit the new Markdown file

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Convert Notion Page
        uses: batuhan/notion-sync-action@main  # Fixed the version tag error here
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
